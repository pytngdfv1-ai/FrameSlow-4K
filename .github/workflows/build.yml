name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      KS_B64: ${{ secrets.KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libltdl-dev libncurses5-dev libffi-dev libssl-dev cmake ccache

      - name: Instalar buildozer
        run: pip install buildozer "cython<3" virtualenv

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Versión incremental
        run: |
          sed -i "s/^version = .*/version = 1.0.${{ github.run_number }}/" buildozer.spec
          sed -i "/^version = /a android.numeric_version = ${{ github.run_number }}" buildozer.spec

      - name: Compilar APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Resumen del error
        if: failure()
        run: |
          M1=$(tail -n 50 build.log | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')
          echo "::error title=ultimas lineas::$M1"
          M2=$(grep -n -i -E "error|failed|not found|fatal" build.log | grep -v -i "warn" | tail -n 25 | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')
          echo "::error title=errores::$M2"

      - name: Firmar APK (si hay keystore) o usar APK debug
        run: |
          APK=$(ls bin/*.apk | head -1)
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
            BT=$(ls -d $HOME/.buildozer/android/platform/android-sdk/build-tools/* | sort -V | tail -1)
            $BT/zipalign -p -f 4 "$APK" aligned.apk
            $BT/apksigner sign --ks "$RUNNER_TEMP/ks.jks" --ks-key-alias frameslow \
              --ks-pass env:KS_PASS --key-pass env:KS_PASS --out FrameSlow4K.apk aligned.apk
            $BT/apksigner verify --print-certs FrameSlow4K.apk
          else
            echo "Sin keystore: APK firmado con clave debug (no actualizable sobre uno firmado)"
            cp "$APK" FrameSlow4K.apk
          fi

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: FrameSlow 4K v${{ github.run_number }}
          files: FrameSlow4K.apk
          make_latest: true
